[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenable-tie-mcp"
version = "0.1.0"
description = "MCP server for Tenable Identity Exposure"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Lower bound: 1.9.0 is the first release with the streamable-http transport
    # that --transport http selects; 1.2.0 raises ValueError there.
    # Upper bound: mcp 2.0.0 moved mcp.server.fastmcp to mcp.server.mcpserver and
    # renamed FastMCP to MCPServer, so server.py fails to import against it. With
    # the bound open, a fresh `pip install -e .` resolved to 2.0.0 and every clone
    # was dead on arrival with ModuleNotFoundError.
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
]

[project.scripts]
tenable-tie-mcp = "tenable_tie_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tenable_tie_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
